<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Blood Bank</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <!-- Premium Global CSS -->
    <style>
        :root {
            --primary-red: #d32f2f;
            --primary-red-hover: #b71c1c;
            --soft-red: #ffebee;
            --bg-color: #f4f6f9;
            --text-main: #2d3748;
            --text-muted: #718096;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(255, 255, 255, 0.4);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 15% 50%, rgba(211, 47, 47, 0.05), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(211, 47, 47, 0.04), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5, h6, .navbar-brand {
            font-family: 'Poppins', sans-serif;
        }

        /* Glassmorphic Navbar */
        .navbar {
            background: rgba(255, 255, 255, 0.8) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
            padding: 15px 0;
            transition: all 0.3s ease;
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--primary-red) !important;
            font-size: 1.5rem;
        }

        .navbar-brand i {
            color: var(--primary-red);
            filter: drop-shadow(0 2px 4px rgba(211, 47, 47, 0.3));
        }

        .nav-link {
            font-weight: 500;
            color: var(--text-main) !important;
            transition: color 0.2s ease;
            margin: 0 5px;
        }

        .nav-link:hover {
            color: var(--primary-red) !important;
        }

        /* Essential Buttons */
        .btn-blood {
            background: linear-gradient(135deg, var(--primary-red) 0%, #e53935 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            padding: 10px 24px;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.25);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .btn-blood:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(211, 47, 47, 0.35);
            background: linear-gradient(135deg, var(--primary-red-hover) 0%, var(--primary-red) 100%);
            color: white;
        }

        .btn-outline-blood {
            background: transparent;
            color: var(--primary-red);
            border: 2px solid var(--primary-red);
            border-radius: 8px;
            font-weight: 600;
            padding: 8px 22px;
            transition: all 0.3s ease;
        }

        .btn-outline-blood:hover {
            background: var(--soft-red);
            color: var(--primary-red-hover);
        }

        /* Glassmorphic Cards */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Form Inputs */
        .form-control, .form-select {
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            padding: 12px 16px;
            background-color: #f8fafc;
            color: var(--text-main);
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .form-control:focus, .form-select:focus {
            background-color: white;
            border-color: rgba(211, 47, 47, 0.4);
            box-shadow: 0 0 0 4px rgba(211, 47, 47, 0.1);
        }
        
        .input-group-text {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            color: var(--text-muted);
        }

        .form-label {
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Footer */
        .footer {
            margin-top: auto;
            padding: 20px 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid rgba(0,0,0,0.05);
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(5px);
        }
        
        /* Interactive Cards (Dashboards) */
        .dash-card {
            text-decoration: none;
            color: inherit;
            display: block;
            height: 100%;
            padding: 30px 20px;
        }
        
        .dash-card:hover {
            color: inherit;
        }
        
        .glass-card.interactive:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 45px rgba(211, 47, 47, 0.1);
            border-color: rgba(211, 47, 47, 0.2);
        }
        
        .icon-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--soft-red) 0%, rgba(211, 47, 47, 0.15) 100%);
            color: var(--primary-red);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2rem;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .glass-card.interactive:hover .icon-circle {
            transform: scale(1.1) rotate(5deg);
        }
        
        /* Tables */
        .table-glass {
            background: transparent;
            margin-bottom: 0;
        }
        
        .table-glass th {
            border-bottom: 2px solid rgba(0,0,0,0.05);
            color: var(--text-muted);
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            padding: 15px;
        }
        
        .table-glass td {
            vertical-align: middle;
            padding: 15px;
            border-bottom: 1px solid rgba(0,0,0,0.03);
            color: var(--text-main);
        }
        
        .table-glass tbody tr {
            transition: background-color 0.2s;
        }
        
        .table-glass tbody tr:hover {
            background-color: rgba(255,255,255,0.5);
        }

        
    </style>
</head>
<body>

    <!-- Unified Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <i class="bi bi-droplet-fill me-2"></i>
                Blood Bank
            </a>
            
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="bi bi-list fs-2 text-dark"></i>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    
                        <li class="nav-item me-2">
                            <a href="/" class="nav-link fw-semibold">Login</a>
                        </li>
                        <li class="nav-item">
                            <a href="/register/" class="btn btn-blood btn-sm rounded-pill px-4">
                                <i class="bi bi-person-plus-fill me-1"></i> Register
                            </a>
                        </li>
                    
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-grow-1">
        
<div class="container d-flex justify-content-center align-items-center py-5 fade-in" style="min-height: 80vh;">
    <div class="col-12 col-sm-8 col-md-6 col-lg-5">
        
        <div class="glass-card">
            
            <div class="card-header border-0 bg-transparent pt-5 pb-0 text-center">
                <div class="icon-circle shadow-sm" style="width: 80px; height: 80px; font-size: 2.5rem; margin-bottom: 25px;">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
                <h3 class="fw-bold mb-1" style="color: var(--primary-red);">Welcome Back</h3>
                <p class="text-muted small">Please sign in to continue</p>
            </div>
            
            <div class="card-body p-4 p-sm-5 pt-3">
                
                

                <form method="post">
                    <input type="hidden" name="csrfmiddlewaretoken" value="HwtIDa4kYj1JqKuTgSrQEHznoLA8PvvkODzewCzCcytSebW91ZnHF5HCDJtAgJKd">
                    
                    <div class="form-floating mb-4">
                        <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
                        <label for="username" class="text-muted"><i class="bi bi-person me-1"></i> Username</label>
                    </div>

                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                        <label for="password" class="text-muted"><i class="bi bi-key me-1"></i> Password</label>
                    </div>

                    <div class="d-grid gap-2 mt-5 mb-3">
                        <button type="submit" class="btn btn-blood btn-lg">
                            Login <i class="bi bi-arrow-right-short fs-4 align-middle"></i>

                    </div>

            </div>
            
            <div class="card-footer border-0 bg-transparent pb-4 pt-0 text-center">
                <p class="text-muted mb-0 small">
                    Don't have an account? 
                    <a href="/register/" class="fw-bold text-decoration-none" style="color: var(--primary-red);">
                        Register here
                    </a>
                </p>
            </div>

        </div>
    </div>
</div>

    </main>

    <!-- Simple Footer -->
    <footer class="footer mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2026 Blood Bank Management System. Saving lives together.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    
</body>
</html>
