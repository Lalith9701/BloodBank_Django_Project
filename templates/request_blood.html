{% extends 'base.html' %}
{% block title %}Request Blood | Blood Bank Management{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-4">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="premium-card">
            
            <div class="premium-card-header flex-column text-center pb-2 border-0" style="background: transparent;">
                <div class="icon-circle mb-3 border border-2 shadow-sm" style="width: 75px; height: 75px; border-radius: 50%; background-color: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 2.2rem; margin: 0 auto; border-color: white !important;">
                    <i class="bi bi-hospital"></i>
                </div>
                <h3 class="fw-bold mb-0" style="color: var(--secondary);">Request Blood</h3>
                <p class="text-muted small mt-2">Submit an official request for blood units.</p>
            </div>
            
            <div class="card-body p-4 p-sm-5 pt-2">
                {% if error %}
                    <div class="alert alert-danger d-flex align-items-center py-2 shadow-sm premium-card border-0" role="alert">
                        <i class="bi bi-exclamation-triangle-fill flex-shrink-0 me-3 text-danger fs-5"></i>
                        <div class="fw-medium text-danger">{{ error }}</div>
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label for="blood_group" class="form-label text-muted fw-semibold small text-uppercase" style="letter-spacing: 0.5px;">Required Blood Group</label>
                        <div class="input-group shadow-sm" style="border-radius: 8px; overflow: hidden;">
                            <span class="input-group-text border-0 bg-light text-danger"><i class="bi bi-droplet-half"></i></span>
                            <select name="blood_group" id="blood_group" class="form-select border-0 ps-2 bg-light" required>
                                <option value="" disabled selected>-- Select Blood Group --</option>
                                {% for group in blood_groups %}
                                    <option value="{{ group.id }}">{{ group.blood_group }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="units_required" class="form-label text-muted fw-bold small text-uppercase">Units Required</label>
                        <input type="number" name="units_required" id="units_required" class="form-control border-0 bg-light shadow-sm py-2" required placeholder="e.g., 2" min="1">
                    </div>

                    <div class="mb-5">
                        <label for="urgency" class="form-label text-muted fw-bold small text-uppercase">Urgency Level</label>
                        <select name="urgency" id="urgency" class="form-select border-0 bg-light shadow-sm py-2" required>
                            <option value="NORMAL">Normal (Standard Procedure)</option>
                            <option value="URGENT">Urgent (Needed within 24h)</option>
                            <option value="EMERGENCY">Emergency (Life-threatening / Asap)</option>
                        </select>
                    </div>

                    <div class="d-grid gap-3">
                        <button type="submit" class="btn btn-primary-custom btn-lg shadow-hover">
                            <i class="bi bi-send-fill me-2"></i> Submit Request
                        </button>
                        <a href="{% url 'dashboard' %}" class="btn btn-secondary-custom btn-lg text-center">
                            <i class="bi bi-arrow-left me-2"></i> Cancel & Return
                        </a>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
