{% extends 'base.html' %}
{% block title %}Password Reset Complete | Blood Bank{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-5">
  <div class="col-12 col-sm-9 col-md-7 col-lg-5">
    <div class="premium-card text-center p-5">

      <div style="width:80px;height:80px;border-radius:50%;background:#dcfce7;
                  color:#16a34a;display:flex;align-items:center;justify-content:center;
                  font-size:2.2rem;margin:0 auto 24px;">
        <i class="bi bi-check-circle-fill"></i>
      </div>

      <h2 class="fw-bold mb-3" style="color:var(--secondary);">Password Updated!</h2>

      <p class="text-muted fs-5 mb-4">
        Your password has been successfully reset. You can now log in with your new password.
      </p>

      <a href="{% url 'login' %}" class="btn btn-primary-custom btn-lg w-100 shadow-sm fw-bold">
        <i class="bi bi-box-arrow-in-right me-2"></i> Log In Now
      </a>

    </div>
  </div>
</div>
{% endblock %}
