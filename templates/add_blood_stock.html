{% extends 'base.html' %}
{% block title %}Add Blood Stock | Blood Bank{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-4">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="premium-card">
            
            <div class="premium-card-header flex-column text-center pb-2 border-0" style="background: transparent;">
                <div class="icon-circle mb-3 border border-2 shadow-sm" style="width: 75px; height: 75px; border-radius: 50%; background-color: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 2.2rem; margin: 0 auto; border-color: white !important;">
                    <i class="bi bi-stack"></i>
                </div>
                <h3 class="fw-bold mb-0" style="color: var(--secondary);">Add Blood Stock</h3>
                <p class="text-muted small mt-2">Increase the inventory units securely.</p>
            </div>
            
            <div class="card-body p-4 p-sm-5 pt-2">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label for="blood_group" class="form-label text-muted fw-semibold small text-uppercase" style="letter-spacing: 0.5px;">Select Blood Group</label>
                        <div class="input-group shadow-sm" style="border-radius: 8px; overflow: hidden;">
                            <span class="input-group-text border-0 bg-light text-danger"><i class="bi bi-droplet-half"></i></span>
                            <select name="blood_group" id="blood_group" class="form-select border-0 ps-2 bg-light" required>
                                <option value="" disabled selected>Choose a blood group...</option>
                                {% for group in groups %}
                                    <option value="{{ group.id }}">{{ group.blood_group }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-5">
                        <label for="units" class="form-label text-muted fw-semibold small text-uppercase" style="letter-spacing: 0.5px;">Units to Add</label>
                        <div class="input-group shadow-sm" style="border-radius: 8px; overflow: hidden;">
                            <span class="input-group-text border-0 bg-light text-muted"><i class="bi bi-bag-plus"></i></span>
                            <input type="number" class="form-control border-0 ps-2 bg-light" id="units" name="units" placeholder="e.g., 5" min="1" required>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-3">
                        <button type="submit" class="btn btn-primary-custom btn-lg shadow-hover">
                            <i class="bi bi-stack me-1"></i> Add Stock
                        </button>
                        <a href="{% url 'blood_stock' %}" class="btn btn-secondary-custom btn-lg text-center">
                            <i class="bi bi-arrow-left me-1"></i> Back to Inventory
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
